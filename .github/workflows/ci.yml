name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

defaults:
  run:
    shell: bash

env:
  UV_LINK_MODE: copy
  PYTHONUTF8: "1"

jobs:
  checks:
    name: Changed-file checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.16"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Check changed Python files and version
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run --no-sync python tools/ci.py check
      - name: Validate GitHub Actions workflow
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/ci.yml

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.12"
          - os: ubuntu-24.04
            python: "3.13"
          - os: ubuntu-24.04
            python: "3.14"
          - os: ubuntu-24.04-arm
            python: "3.12"
          - os: macos-15
            python: "3.12"
          - os: windows-2022
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.16"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install inspection dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libimage-exiftool-perl
      - run: uv sync --locked
      - name: Full suite including Linux publication and ExifTool
        if: runner.os == 'Linux'
        run: uv run --no-sync pytest -q --junitxml=reports/pytest.xml
      - name: Portable synthesis suite
        if: runner.os != 'Linux'
        # Output-directory publication is explicitly Linux-only in the runtime.
        run: >-
          uv run --no-sync pytest -q --junitxml=reports/pytest.xml
          tests/test_pixel_shift.py tests/test_merge.py tests/test_radial.py
          tests/test_nefx.py tests/test_nefx_roundtrip.py
          tests/test_tiff_stream.py tests/test_raw_metadata.py
          tests/test_camera_merge.py
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.os }}-py${{ matrix.python }}
          path: reports/*.xml
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build (${{ matrix.target }})
    needs: [checks, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15
            target: macos-arm64
          - os: windows-2022
            target: windows-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.16"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --group build --no-editable
      - name: Build source and wheel distributions
        run: uv build --no-sources
      - name: Install the built wheel
        run: |
          uv pip install --no-deps --reinstall dist/*.whl
          uv pip check
      - name: Test installed wheel serialization and CLI
        run: |
          uv run --no-sync pytest -q tests/test_nefx_roundtrip.py tests/test_camera_merge.py
          uv run --no-sync python tools/ci.py smoke
      - name: Freeze, archive, extract, and test standalone CLI
        run: uv run --no-sync python tools/ci.py build --target '${{ matrix.target }}'
      - name: Upload verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nxc-${{ matrix.target }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
