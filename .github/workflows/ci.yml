name: Native CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

defaults:
  run:
    shell: bash

env:
  UV_LINK_MODE: copy
  PYTHONUTF8: "1"

jobs:
  checks:
    name: Changed-file checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.16"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Check changed files and native version
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run --no-sync python tools/ci.py check
      - name: Validate workflow
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/ci.yml

  native:
    name: Build and verify (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15
            target: macos-arm64
          - os: windows-2022
            target: windows-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.16"
          python-version: "3.12"
          enable-cache: true
      - name: Configure pinned native build
        run: >-
          cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release
          -DCNEFX_PACKAGE_TARGET=${{ matrix.target }}
      - run: cmake --build build/release --config Release --parallel 2
      - run: ctest --test-dir build/release -C Release --output-on-failure --output-junit native-tests.xml
      - run: uv sync --locked
      - name: Pinned core, container and CLI regression checks
        run: uv run --no-sync python tools/ci.py verify
      - name: Package and run extracted binary with empty PATH
        run: uv run --no-sync python tools/ci.py package
      - name: Upload verified native package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cnefx-${{ matrix.target }}
          path: |
            build/release/packages/*.tar.gz
            build/release/packages/*.zip
            build/release/packages/*.sha256
            build/release/packages/verification.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Preserve validation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-${{ matrix.target }}
          path: |
            build/release/native-tests.xml
            build/release/verification/*/report.json
          if-no-files-found: warn
          retention-days: 14

  sanitize:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.16"
          python-version: "3.12"
          enable-cache: true
      - run: cmake --preset sanitize
      - run: cmake --build --preset sanitize
      - run: ctest --preset sanitize --output-junit native-tests.xml
      - run: uv sync --locked
      - run: uv run --no-sync python tools/ci.py verify --build-dir build/sanitize --config Debug
      - name: Preserve sanitizer reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-sanitize
          path: |
            build/sanitize/native-tests.xml
            build/sanitize/verification/*/report.json
          if-no-files-found: warn
          retention-days: 14
