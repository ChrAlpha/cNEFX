name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    name: Native CI
    uses: ./.github/workflows/ci.yml

  github:
    name: Publish GitHub release
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: cnefx-*
          path: dist
          merge-multiple: true
      - name: Create release with native archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "cNEFX ${GITHUB_REF_NAME#v}" \
            --notes "Experimental: validation against authentic captures with matching NX Studio references, and Lightroom compatibility testing, remain pending."

  npm:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: npm-package
          path: build/npm
      - name: Publish through npm trusted publishing
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$(npm view "cnefx-cli@$version" version 2>/dev/null)" = "$version" ]; then
            echo "cnefx-cli@$version is already published."
          else
            npm publish "build/npm/cnefx-cli-$version.tgz"
          fi
