[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nx-ctudio"
version = "0.1.0"
description = "Independent tools for Nikon RAW workflows, starting with pixel-shift research."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nxc = "nx_ctudio.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/nx_ctudio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
