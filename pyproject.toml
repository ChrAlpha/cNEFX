[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cnefx-reference"
version = "0.0.1"
description = "Python reference and research harness for native cNEFX verification."
requires-python = ">=3.12"
dependencies = [
    "numpy==2.4.6",
    "rawpy==0.27.1",
    "tifffile==2026.9.15",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["reference/nx_ctudio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
