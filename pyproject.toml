[project]
name = "cnefx-checks"
version = "0.0.1"
description = "Development checks for the native cNEFX executable."
requires-python = ">=3.12"
dependencies = [
    "numpy==2.4.6",
    "rawpy==0.27.1",
    "tifffile==2026.9.15",
]

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
src = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
